<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dušan Blanuša | AI Technology Lead &amp; Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem('dusan-portfolio-theme');
        const theme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* Use the light theme when preferences are unavailable. */ }
    })();
  </script>
  <meta name="description" content="Dušan Blanuša designs and delivers production-grade AI systems, multi-agent platforms, RAG pipelines, automation, and scalable machine-learning infrastructure.">
  <meta name="theme-color" content="#f4f5f0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/images/dusan-ai.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/images/dusan-real.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

</body>
</html>
