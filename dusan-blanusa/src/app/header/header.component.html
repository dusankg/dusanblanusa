<header class="site-header">
  <div class="header-inner container-shell">
    <a class="identity" href="#top" aria-label="Dušan Blanuša, back to top">DB.</a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span><span></span>
    </button>

    <div class="nav-wrap" [class.is-open]="menuOpen">
      <nav id="primary-navigation" aria-label="Primary navigation">
        @for (item of navItems; track item.href) {
          <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
        }
      </nav>
      <a class="cv-link" href="assets/CV Dusan Blanusa.pdf" download (click)="closeMenu()">
        Download CV
      </a>
    </div>
  </div>
</header>
