<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="container-shell" appRevealOnScroll>
    <p class="section-kicker">Contact</p>
    <h2 id="contact-title">Have a complex<br>AI problem?</h2>
    <div class="contact-bottom">
      <p>
        If you are building an AI product, automating a complex workflow, or modernizing an existing
        data and machine-learning platform, I would be glad to hear what you are working on.
      </p>
      <div class="contact-actions">
        <a class="conversation" [href]="mailto">
          <span>Start a conversation</span>
          <i aria-hidden="true">↗</i>
        </a>
        <button
          class="ask-ai"
          type="button"
          aria-controls="chatbot-dialog"
          [attr.aria-expanded]="chatbotStore.isOpen()"
          (pointerenter)="warmChat()"
          (pointerdown)="warmChat()"
          (focus)="warmChat()"
          (click)="openChat($event)"
        >
          Have a question first? Ask my AI assistant.
          <span aria-hidden="true">DB.</span>
        </button>
      </div>
    </div>
    <nav aria-label="Contact links">
      <a href="https://www.linkedin.com/in/dusan-blanusa" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/dusankg" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      <a href="assets/CV Dusan Blanusa.pdf" download>Download CV <span aria-hidden="true">↓</span></a>
    </nav>
  </div>
</section>
