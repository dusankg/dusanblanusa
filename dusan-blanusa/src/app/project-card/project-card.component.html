<article class="project-card" [style.--card-number]="index + 1">
  <div class="project-visual" aria-hidden="true">
    <span class="visual-number">{{ project.number }}</span>
    <div class="visual-grid"></div>
    <img [src]="project.image" alt="" width="1536" height="1024" loading="lazy">
  </div>

  <div class="project-content">
    <div class="project-meta">
      <span>{{ project.category }}</span>
    </div>
    <h3>{{ project.name }}</h3>
    <p class="overview">{{ project.overview }}</p>

    <div class="details">
      <div class="details-inner">
        <dl>
          <div>
            <dt>Role</dt>
            <dd>{{ project.role }}</dd>
          </div>
          <div>
            <dt>Technology</dt>
            <dd>{{ project.technology.join(' · ') }}</dd>
          </div>
          <div>
            <dt>Outcome</dt>
            <dd>{{ project.outcome }}</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</article>
